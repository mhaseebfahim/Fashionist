# Render Blueprint — New → Blueprint → pick this repo. Creates the Fashionist API web service.
# Secrets marked `sync: false` are entered in the Render dashboard (never committed).
services:
  - type: web
    name: fashionist-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # e.g. https://fashionist.store,https://www.fashionist.store
      - key: SITE_URL
        value: https://fashionist.store
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        value: "true"
      - key: ALLOWED_EMAIL_DOMAINS
        value: gmail.com,outlook.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Fashionist <no-reply@fashionist.store>
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
